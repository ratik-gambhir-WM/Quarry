[package]
name = "quarry-desktop"
version = "0.1.0"
description = "Thin desktop shell for the shared Quarry application"
authors = ["Quarry contributors"]
edition = "2021"
default-run = "quarry-desktop"

[lib]
name = "quarry_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
