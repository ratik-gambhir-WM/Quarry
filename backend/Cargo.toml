[package]
name = "quarry-backend"
version = "0.1.0"
description = "Quarry Axum product API"
authors = ["Quarry contributors"]
edition = "2021"
rust-version = "1.94"
default-run = "quarry-backend"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "quarry_backend"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "arbitrary_precision"] }
base64 = "0.23.1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "blocking"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "compression-gzip",
  "cors",
  "request-id",
  "timeout",
  "trace",
] }
walkdir = "2.5.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = "0.3.31"
uuid = { version = "1.18.1", features = ["v4"] }
docx-rust = "0.1.11"
pdf-extract = "0.12.0"
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
image = "0.24.9"
calamine = "0.36.1"
pptx-to-md = "0.4.0"
roxmltree = "0.20.0"
chrono = "0.4.45"
helix-db = "3.0.0"
dotenvy = "0.15.7"
anyhow = "1.0.104"
thiserror = "2.0.19"
tiktoken-rs = "0.12.0"
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libc = "0.2"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

# ZIP 8 preserves the imported OOXML package safety checks; existing parsers retain ZIP 4.
zip_slide = { package = "zip", version = "8.6.0", default-features = false, features = ["deflate"] }
bytes = "1.12.1"
tempfile = "3.27.0"
url = "2.5.8"
tungstenite = "0.30.0"
regex = "1"
icu_collator = "2.3.1"
icu_locale = "2.3.1"
